# ============================================================
# AIOps · Docker Compose（正式环境默认）
# ------------------------------------------------------------
# 服务组成：
#   - aiops-server      : Go 单容器（内嵌前端），Web/API 端口 8529
#   - victoriametrics   : 时序指标库（remote-write）
#   - postgres          : 关系库（配置/用户/审计/事件/工单/会话 + pgvector）
#   - aiops-agent       : 可选本机 Agent（需 --profile agent）
#
# 存储说明：内置 aiops.db 已停用；server 强制要求 PostgreSQL + VictoriaMetrics。
#
# ------------------------------------------------------------
# 正式环境（拉取华为云 SWR 预构建镜像）
#   cp .env.example .env          # 务必改密码与 AIOPS_SECRET_KEY
#   docker compose up -d
#   # 或一键生成强随机密钥：
#   bash scripts/secure-compose.sh && docker compose up -d
#
# 开发环境（本地 Dockerfile.dev 构建，见 docker-compose.dev.yml）
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 附带本机 Agent：
#   docker compose --profile agent up -d
#   # 开发环境已默认启用 agent，无需再加 profile
#
# 常用：
#   docker compose logs -f
#   docker compose down           # 停服务，数据保留；加 -v 删卷
#
# 镜像说明：
#   - aiops-server / aiops-agent : 默认华为云 SWR（CI 推送 linux/amd64+arm64）
#   - postgres / victoriametrics : 默认 SWR 同步镜像；本机无法拉 SWR 时在 .env 改：
#       POSTGRES_IMAGE=pgvector/pgvector:pg18
#       VM_IMAGE=victoriametrics/victoria-metrics:latest
#     或使用 docker-compose.dev.yml（开发 overlay 已切到 Docker Hub）
# ============================================================

services:
  aiops-server:
    image: ${AIOPS_SERVER_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/aiops-server}:${AIOPS_IMAGE_TAG:-latest}
    container_name: aiops-server
    ports:
      - "${AIOPS_HTTP_PORT:-8529}:8529"
      - "${AIOPS_FORWARD_PORT_RANGE:-10100-10300}:10100-10300"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AIOPS_FORWARD_LISTEN=0.0.0.0
      - AIOPS_VM_URL=${AIOPS_VM_URL:-http://victoriametrics:8428}
      # ⚠️ 生产请改 POSTGRES_PASSWORD / AIOPS_SECRET_KEY（见 .env.example）
      - AIOPS_POSTGRES_DSN=postgres://aiops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (run scripts/secure-compose.sh)}@postgres:5432/aiops?sslmode=disable
      - AIOPS_SECRET_KEY=${AIOPS_SECRET_KEY:?AIOPS_SECRET_KEY must be set in .env (run scripts/secure-compose.sh)}
      - AIOPS_CONTENT_AUDIT_INGEST_TOKEN=${AIOPS_CONTENT_AUDIT_INGEST_TOKEN:-}
      # 可选：固定安装 Token（与 aiops-agent 的 AIOPS_TOKEN 同步；留空则服务端首次启动自动生成，并写入 ./data/.install_token）
      - AIOPS_INSTALL_TOKEN=${AIOPS_INSTALL_TOKEN:-}
      # 可选 HTTPS（证书放到 ./data/tls 后取消注释）
      # - AIOPS_TLS_CERT=/app/data/tls/server.crt
      # - AIOPS_TLS_KEY=/app/data/tls/server.key
      # 可选天气头（阿里云市场 AppCode）
      # - AIOPS_WEATHER_APPCODE=
      # - AIOPS_WEATHER_DEFAULT_IP=114.114.114.114
    depends_on:
      victoriametrics:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  victoriametrics:
    image: ${VM_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/victoria-metrics:latest}
    container_name: aiops-vm
    command:
      - "-storageDataPath=/vmdata"
      # 100y ≈ 永久保留；磁盘吃紧可改 -retentionPeriod=36（月）
      - "-retentionPeriod=100y"
      - "-httpListenAddr=:8428"
    #ports:
    #  - "8428:8428"   # 可选：直接访问 VM UI / PromQL（仅内网）
    volumes:
      - ./vm-data:/vmdata
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/pgvector:pg18}
    container_name: aiops-pg
    # 与 server SetMaxOpenConns(200) 对齐：默认 100 会在高并发下报 too many clients
    command:
      - "postgres"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      - POSTGRES_USER=aiops
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (run scripts/secure-compose.sh)}
      - POSTGRES_DB=aiops
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # 具名卷：Windows/Mac 绑定挂载对 PG fsync 不可靠，易 WAL 损坏。
      # Linux 服务器可改：- ./pgdata:/var/lib/postgresql
      - aiops-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 可选：采集本容器/宿主指标。正式环境默认关闭；启用：
  #   docker compose --profile agent up -d
  # 自动加入主机列表：挂载 ./data 读取服务端发布的 .install_token，无需手工拷贝 Token。
  # Demo 安全默认：进程以非 root(aiops/10001) 运行；不挂宿主根盘、不 privileged、降权能力。
  aiops-agent:
    profiles: ["agent"]
    image: ${AIOPS_AGENT_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/aiops-agent}:${AIOPS_IMAGE_TAG:-latest}
    container_name: aiops-agent
    depends_on:
      aiops-server:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AIOPS_SERVER=http://aiops-server:8529
      # 优先用 .env 中的 AIOPS_INSTALL_TOKEN；未设置时读服务端写入的 Token 文件
      - AIOPS_TOKEN=${AIOPS_INSTALL_TOKEN:-}
      - AIOPS_TOKEN_FILE=/app/server-data/.install_token
      - AIOPS_STATE_FILE=/app/data/agent_state.json
      - AIOPS_CATEGORY=${AIOPS_AGENT_CATEGORY:-Docker}
      # 稳定指纹：避免容器重建后 MAC 变化导致重复主机
      - AIOPS_MACHINE_ID=${AIOPS_AGENT_MACHINE_ID:-aiops-compose-agent}
    volumes:
      - aiops-agent-data:/app/data
      - ./data:/app/server-data:ro
    # 入口仅短暂用 root 修正卷属主后 su-exec 降权；运行态无特权。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      # Writable HOME for interactive remote terminal (login shell / history)
      - /home/aiops:size=32M,mode=1777,uid=10001,gid=10001
    restart: unless-stopped

volumes:
  aiops-pgdata:
  aiops-agent-data:
    # 备份：docker exec aiops-pg pg_dump -U aiops aiops > backup.sql
    # 删数据：docker compose down -v  或  docker volume rm <project>_aiops-pgdata
